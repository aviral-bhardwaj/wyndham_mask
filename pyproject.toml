[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "va_datamask"
version = "1.0.0"
description = "Internal reversible data masking for PySpark and Databricks"
requires-python = ">=3.11"
dependencies = ["cryptography>=43,<51", "PyYAML>=6,<7"]
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
spark = ["pyspark>=3.5,<4", "pandas>=2,<3", "pyarrow>=14,<20"]
delta = ["delta-spark>=3.2,<4"]
dev = ["pytest>=8", "pytest-cov>=5", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
va_datamask = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: requires a local Spark runtime", "delta: requires Delta jars"]

[tool.coverage.run]
source = ["va_datamask"]
